sonar.projectKey=eventify-app
sonar.projectName=Eventify Platform
sonar.projectVersion=1.0.0

# Folder sumber kode yang dipindai
sonar.sources=backend/src,frontend/src

# Kecualikan folder testing & node_modules dari metrik duplikasi
sonar.exclusions=**/node_modules/**,**/*.test.ts,backend/prisma/**

# Lokasi file test
sonar.tests=backend/src/__tests__
sonar.test.inclusions=**/*.test.ts

# Format LCOV Coverage dari Bun Test
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
