sonar.projectKey=eventify-app
sonar.projectName=Eventify Platform
sonar.projectVersion=1.0.0

sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/__tests__/**,**/coverage/**,**/.svelte-kit/**

sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/__tests__/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
