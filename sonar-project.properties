sonar.projectKey=eventify-app
sonar.projectName=Eventify Platform
sonar.projectVersion=1.0.0

sonar.sources=frontend/src,backend/src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/.svelte-kit/**,**/*.test.ts,**/__tests__/**

sonar.tests=frontend/src
sonar.test.inclusions=**/*.test.ts

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=**/*.svelte,**/test-utils.ts,**/vitest-setup.ts,**/*.config.ts,backend/src/server.ts

sonar.sourceEncoding=UTF-8
